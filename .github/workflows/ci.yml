name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      # Deliberately not IST: date handling must not depend on the host zone.
      - run: npm test
        env:
          TZ: America/New_York

      # No env: the demo has no backend, so nothing is configured at build time.
      - run: npm run build
